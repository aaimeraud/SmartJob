services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smart_job}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_job}
      POSTGRES_DB: ${POSTGRES_DB:-smart_job}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart_job} -d ${POSTGRES_DB:-smart_job}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres:
